# ============================================================
# EPOS — Docker Compose de PRODUCCIÓN (solo la app)
#
# Postgres corre NATIVO en el host (fuera de Docker); esta app
# se conecta vía host.docker.internal. Ver deploy/prod/README.md.
#
# Ubicación en el VPS: /var/www/html/prod/docker-compose.yml
# ============================================================

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/artisoft-argentina/epos-final:prod}
    container_name: prod-epos-app
    restart: unless-stopped
    ports:
      - '127.0.0.1:8000:80'          # solo lo alcanza el nginx del host
    environment:
      - RUN_MIGRATIONS=true          # migra la base CENTRAL en cada arranque (incremental)
      - RUN_SEEDERS=false            # true SOLO en el primer boot (ver README §6.3)
      - DB_HOST=host.docker.internal # el entrypoint (pg_isready) lo lee del shell, no del .env
      - DB_PORT=5432
      - DB_USERNAME=epos_user
    extra_hosts:
      - "host.docker.internal:host-gateway"   # resuelve al gateway de docker0 (Postgres del host)
    volumes:
      - ./storage:/var/www/html/storage       # certs, uploads, PDFs → PERSISTE
      - ./.env:/var/www/html/.env
    networks:
      - epos-network

networks:
  epos-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16      # red del proyecto (no colisiona con docker0 172.16.x)
