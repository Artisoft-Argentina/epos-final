# ============================================================
# EPOS — Docker Compose de PRODUCCIÓN (solo la app)
#
# Postgres corre NATIVO en el host (fuera de Docker); esta app
# se conecta vía host.docker.internal. Ver deploy/README.md.
#
# Ubicación en el VPS: /var/www/html/prod/docker-compose.yml
# ============================================================

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/artisoft-argentina/epos-final:prod}
    container_name: prod-epos-app
    restart: unless-stopped
    ports:
      - '127.0.0.1:8000:80'          # solo lo alcanza el nginx del host
    environment:
      - RUN_MIGRATIONS=true          # migra la base CENTRAL en cada arranque (incremental)
      - RUN_SEEDERS=false            # true SOLO en el primer boot (ver README 2.8)
    extra_hosts:
      - "host.docker.internal:host-gateway"   # así el contenedor ve el Postgres del host
    volumes:
      - ./storage:/var/www/html/storage       # certs ARCA, uploads, PDFs → PERSISTE
      - ./.env:/var/www/html/.env
    networks:
      - epos-network

networks:
  epos-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16      # gateway fijo 172.20.0.1 (lo que autoriza pg_hba)
