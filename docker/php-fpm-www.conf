[global]
; Proceso principal de PHP-FPM
pid = /var/run/php-fpm.pid
error_log = /var/log/php-fpm-error.log
daemonize = no

[www]
; Coincidir con nginx.conf: fastcgi_pass 127.0.0.1:9000
listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Usuario bajo el cual corren los workers
user = www-data
group = www-data

; Modo dynamic para balancear entre rendimiento y memoria
pm = dynamic
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 15
pm.max_requests = 500
pm.status_path = /fpm-status

; Logs de workers
catch_workers_output = yes
slowlog = /var/log/php-fpm-slow.log
request_slowlog_timeout = 10s

; Límites de requests y tiempo
request_terminate_timeout = 300s
rlimit_files = 65535

; Variables de entorno del pool
clear_env = no

; Número de backlog de conexiones pendientes
listen.backlog = 1024
