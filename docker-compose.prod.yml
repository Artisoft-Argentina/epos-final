# ============================================================
# EPOS - Docker Compose para producción
# Uso: docker compose -f docker-compose.prod.yml up -d
#
# Acceso:
#   Central (admin):  http://epos.lvh.me:${APP_PORT}
#   Tenant ejemplo:   http://empresa1.epos.lvh.me:${APP_PORT}
#
# lvh.me es un DNS público que resuelve *.lvh.me → 127.0.0.1
# No requiere configurar /etc/hosts.
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: ${APP_ENV}-epos-app
    restart: unless-stopped
    ports:
      - '${APP_PORT}:80'
    environment:
      - RUN_MIGRATIONS=true
      - RUN_SEEDERS=true
    volumes:
      # vendor_data persiste las dependencias PHP entre reinicios.
      # IMPORTANTE: si cambian composer.json/lock, correr: docker compose down -v && docker compose up --build
      - vendor_data:/var/www/html/vendor
      # public/build viene de la imagen (node-builder). NO montar como volumen:
      # un volumen existente ocultaría los assets nuevos tras un rebuild.
      - ./storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - epos-network

  postgres:
    image: postgres:16-alpine
    container_name: ${APP_ENV}-epos-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=epos_central
      - POSTGRES_USER=epos_user
      - POSTGRES_PASSWORD=epos_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Otorga CREATEDB al usuario (requerido para multitenant)
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-grants.sql
    ports:
      - '${DB_EXTERNAL_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U epos_user -d epos_central']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - epos-network

  redis:
    image: redis:7-alpine
    container_name: ${APP_ENV}-epos-redis
    restart: unless-stopped
    ports:
      - '${REDIS_EXTERNAL_PORT:-6380}:6379'
    volumes:
      - redis_data:/data
    networks:
      - epos-network

volumes:
  postgres_data:
  redis_data:
  vendor_data:

networks:
  epos-network:
    driver: bridge