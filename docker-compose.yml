# ============================================================
# EPOS - Docker Compose para desarrollo LOCAL
# Uso: docker compose up -d
#
# Acceso:
#   http://epos.lvh.me:${APP_PORT}
#
# lvh.me es un DNS público que resuelve *.lvh.me → 127.0.0.1
# No requiere configurar /etc/hosts.
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_ENV}-epos-app
    restart: unless-stopped
    ports:
      - '${APP_PORT}:80'
      - '5173:5173'
    environment:
      - RUN_MIGRATIONS=true
      - RUN_SEEDERS=true
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - epos-network

  postgres:
    image: postgres:16-alpine
    container_name: ${APP_ENV}-epos-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=epos_central
      - POSTGRES_USER=epos_user
      - POSTGRES_PASSWORD=epos_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '${DB_EXTERNAL_PORT}:5432' # Acceso local desde herramientas como TablePlus/DBeaver
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U epos_user -d epos_central']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - epos-network

  redis:
    image: redis:7-alpine
    container_name: ${APP_ENV}-epos-redis
    restart: unless-stopped
    ports:
      - '${REDIS_EXTERNAL_PORT}:6379'
    volumes:
      - redis_data:/data
    networks:
      - epos-network

volumes:
  postgres_data:
  redis_data:

networks:
  epos-network:
    driver: bridge
