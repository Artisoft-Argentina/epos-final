# ============================================================
# EPOS - Docker Compose para desarrollo LOCAL
# Uso: docker compose up -d
#
# Acceso:
#   Central (admin):  http://epos.lvh.me:${APP_PORT}
#   Tenant ejemplo:   http://empresa1.epos.lvh.me:${APP_PORT}
#
# lvh.me es un DNS público que resuelve *.lvh.me → 127.0.0.1
# No requiere configurar /etc/hosts.
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_ENV}-epos-app
    restart: unless-stopped
    ports:
      - '${APP_PORT}:80'
      - '5173:5173'
    environment:
      - RUN_MIGRATIONS=true
      - RUN_SEEDERS=true
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./docker/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
      - ./docker/entrypoint.sh:/entrypoint.sh
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - epos-network

  # -------------------------------------------------------
  # MySQL (comentado — backup por si se necesita revertir)
  # -------------------------------------------------------
  # mysql:
  #   image: mysql:8.0
  #   container_name: ${APP_ENV}-epos-mysql
  #   restart: unless-stopped
  #   environment:
  #     - MYSQL_ROOT_PASSWORD=epos_root_2024
  #     - MYSQL_DATABASE=epos_central
  #     - MYSQL_USER=epos_user
  #     - MYSQL_PASSWORD=epos_password
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #     - ./docker/mysql.cnf:/etc/mysql/conf.d/custom.cnf
  #     - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/01-grants.sql
  #   ports:
  #     - '${DB_EXTERNAL_PORT}:3306'
  #   healthcheck:
  #     test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-pepos_root_2024']
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 30s
  #   networks:
  #     - epos-network

  postgres:
    image: postgres:16-alpine
    container_name: ${APP_ENV}-epos-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=epos_central
      - POSTGRES_USER=epos_user
      - POSTGRES_PASSWORD=epos_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Otorga CREATEDB al usuario (requerido para multitenant)
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-grants.sql
    ports:
      - '${DB_EXTERNAL_PORT}:5432' # Acceso local desde herramientas como TablePlus/DBeaver
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U epos_user -d epos_central']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - epos-network

  redis:
    image: redis:7-alpine
    container_name: ${APP_ENV}-epos-redis
    restart: unless-stopped
    ports:
      - '${REDIS_EXTERNAL_PORT}:6379'
    volumes:
      - redis_data:/data
    networks:
      - epos-network

volumes:
  postgres_data:
  # mysql_data:  # comentado
  redis_data:

networks:
  epos-network:
    driver: bridge
