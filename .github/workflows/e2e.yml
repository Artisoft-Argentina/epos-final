name: e2e

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# `lvh.me` y todos sus subdominios resuelven a 127.0.0.1 vía DNS público,
# así que no necesitamos /etc/hosts adicional para `e2e.epos.lvh.me`.

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: epos_user
          POSTGRES_PASSWORD: epos_password
          POSTGRES_DB: epos_central
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      APP_KEY: ''
      APP_URL: http://epos.lvh.me:8000
      APP_PORT: '8000'
      CENTRAL_DOMAIN: epos.lvh.me
      TENANCY_DB_PREFIX: epos_
      SESSION_DOMAIN: .lvh.me
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: epos_central
      DB_USERNAME: epos_user
      DB_PASSWORD: epos_password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: sync
      E2E_ARTISAN_CMD: 'php artisan'
      E2E_TENANT: e2e

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, pgsql, redis, intl, gd, zip, bcmath, soap
          coverage: none
          tools: composer:v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate APP_KEY
        run: php artisan key:generate

      - name: Build assets
        run: pnpm build

      - name: Migrate central DB
        run: php artisan migrate --force

      - name: Seed central DB
        run: php artisan db:seed --force

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start app server in background
        run: |
          php artisan serve --host=0.0.0.0 --port=8000 > /tmp/serve.log 2>&1 &
          # Esperar hasta que responda en el dominio central.
          for i in {1..30}; do
            if curl -s -o /dev/null -H "Host: epos.lvh.me" http://127.0.0.1:8000/login; then
              echo "App up"
              exit 0
            fi
            sleep 1
          done
          echo "App did not start"
          cat /tmp/serve.log
          exit 1

      - name: Run Playwright suite
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      - name: Tail serve log on failure
        if: failure()
        run: cat /tmp/serve.log || true
