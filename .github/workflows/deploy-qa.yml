name: Deploy to Hostinger VPS (QA)

on:
  push:
    branches: [qa]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      servers: ${{ steps.vars.outputs.servers }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image and server matrix
        id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          SERVERS=$(jq -c . deploy/deployment-config.qa.json)
          echo "servers=$SERVERS" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ steps.vars.outputs.image }}:qa

  deploy:
    needs: build
    name: deploy ${{ matrix.server.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJson(needs.build.outputs.servers) }}
    steps:
      - name: 🚀 Deploy
        uses: appleboy/ssh-action@v1.0.0
        env:
          IMG: ${{ needs.build.outputs.image }}:qa
        with:
          # ip/username vacíos en el JSON → secrets.
          host: ${{ matrix.server.ip || secrets.VPS_HOST }}
          username: ${{ matrix.server.username || secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ matrix.server.port }}
          command_timeout: 30m
          envs: IMG
          # Hooks en el mismo shell que el deploy: un `export` del beforeHooks (ej. COMPOSE_FILE) aplica al compose.
          script: |
            set -e
            cd ${{ matrix.server.path }}
            ${{ matrix.server.beforeHooks }}
            docker pull "$IMG"
            APP_IMAGE="$IMG" docker compose up -d --force-recreate --wait
            ${{ matrix.server.afterHooks }}
            echo "✅ Deployment completed successfully!"

      - name: Notify
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: always()
