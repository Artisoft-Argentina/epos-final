name: Deploy to Hostinger VPS (QA)

on:
  push:
    branches: [qa]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ env.IMAGE }}:qa

      - name: 🚀 Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -e
            cd /var/www/html/qa
            IMG=ghcr.io/artisoft-argentina/epos-final:qa
            echo "📥 Pulling image from GHCR..."
            docker pull $IMG
            echo "🐳 Restarting containers..."
            APP_IMAGE=$IMG docker compose -f docker-compose.prod.yml up -d --force-recreate --wait
            echo "🗄️  Migrando bases de tenants..."
            docker compose -f docker-compose.prod.yml exec -T app php artisan tenants:migrate --force
            echo "✅ Deployment completed successfully!"

      - name: Notify
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: always()
